<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyBoard</title>
  </head>
  <body>
    <!-- Временная заглушка T0.1: проверяет, что API и WebSocket доступны через Caddy. -->
    <h1>MyBoard</h1>
    <p>Stack placeholder. The real interface arrives in a later task.</p>
    <p>API: <span id="api">checking…</span></p>
    <p>WebSocket: <span id="ws">checking…</span></p>
    <script>
      // Адреса строятся из адреса страницы, без localhost.
      fetch("/api/health")
        .then((r) => r.json())
        .then((body) => (document.getElementById("api").textContent = body.status))
        .catch(() => (document.getElementById("api").textContent = "unreachable"));

      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${scheme}//${location.host}/api/ws`);
      const wsStatus = document.getElementById("ws");
      socket.onopen = () => socket.send("ping");
      socket.onmessage = (e) => {
        wsStatus.textContent = e.data === "ping" ? "ok" : "unexpected reply";
        socket.close();
      };
      socket.onerror = () => (wsStatus.textContent = "unreachable");
    </script>
  </body>
</html>
