[project]
name = "myboard-acceptance-api"
version = "0.1.0"
description = "Приёмочные тесты QA: HTTP и WebSocket против запущенного стека"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8.3",
    "httpx>=0.28",
    "websockets>=14.0",
    "pycrdt>=0.14.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
